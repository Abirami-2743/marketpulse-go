name: marketpulse_go
description: "MarketPulse Go - AI-powered market intelligence, on the move."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  provider: ^6.1.1
  flutter_secure_storage: ^9.0.0
  fl_chart: ^0.66.0
  intl: ^0.19.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0


flutter:
  uses-material-design: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"

flutter_native_splash:
  color: "#0B0F14"
  image: "assets/icon/splash_icon.png"
  android_12:
    image: "assets/icon/splash_icon.png"
    color: "#0B0F14"